<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birim Çevirici</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
    padding: 20px;
  }
  h1 { font-size: 1.5rem; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tabs button {
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #334155;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 700;
    cursor: pointer;
    font-size: .85rem;
  }
  .tabs button.active { background: #22c55e; color: #052e16; border-color: transparent; }
  .panel {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 22px;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: grid; grid-template-columns: 1fr 140px; gap: 10px; align-items: end; }
  label { font-size: .78rem; color: #94a3b8; display: block; margin-bottom: 6px; }
  input, select {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    padding: 11px 12px;
    border-radius: 9px;
    font-size: 1rem;
  }
  input:focus, select:focus { outline: 2px solid #22c55e; }
  .swap-row { display: flex; justify-content: center; }
  .swap {
    background: #334155;
    color: #e2e8f0;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .result {
    background: #14532d;
    border: 1px solid #166534;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .result b { font-size: 1.5rem; color: #4ade80; font-variant-numeric: tabular-nums; word-break: break-all; }
  .result span { display: block; color: #86efac; font-size: .8rem; margin-top: 4px; }
  .units { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px; }
  .units div {
    background: #273449;
    border-radius: 8px;
    padding: 8px;
    font-size: .75rem;
    text-align: center;
    color: #94a3b8;
  }
  .units b { display: block; color: #e2e8f0; font-size: .82rem; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .muted { color: #64748b; font-size: .8rem; text-align: center; }
</style>
</head>
<body>
  <h1>📐 Birim Çevirici</h1>
  <div class="tabs" id="tabs"></div>

  <div class="panel">
    <div class="row">
      <div>
        <label for="fromVal">Değer</label>
        <input id="fromVal" type="number" step="any" value="1">
      </div>
      <div>
        <label for="fromUnit">Kaynak birim</label>
        <select id="fromUnit"></select>
      </div>
    </div>

    <div class="swap-row">
      <button class="swap" id="swap" title="Değiştir">⇅</button>
    </div>

    <div class="row">
      <div>
        <label for="toUnit">Hedef birim</label>
        <select id="toUnit"></select>
      </div>
      <div style="text-align:right">
        <label>&nbsp;</label>
        <div class="result"><b id="out">—</b><span id="outExact"></span></div>
      </div>
    </div>

    <div class="units" id="unitsBox"></div>
  </div>

  <div class="muted">Yazdıkça çevrilir · ⇅ ile birimleri ters çevir</div>

<script>
const CATS = {
  'Uzunluk': {
    mm: ['Milimetre', 0.001], cm: ['Santimetre', 0.01], m: ['Metre', 1],
    km: ['Kilometre', 1000], inch: ['İnç', 0.0254], ft: ['Fit', 0.3048],
    mi: ['Mil', 1609.344], 'nmi': ['Deniz mili', 1852]
  },
  'Ağırlık': {
    mg: ['Miligram', 0.000001], g: ['Gram', 0.001], kg: ['Kilogram', 1],
    t: ['Ton', 1000], lb: ['Libre', 0.45359237], oz: ['Ons', 0.02834952]
  },
  'Sıcaklık': {
    C: ['Santigrat', 'c2k'], F: ['Fahrenhayt', 'f2k'], K: ['Kelvin', 'k'], 'Ra': ['Rankine', 'r2k']
  },
  'Hacim': {
    ml: ['Mililitre', 0.001], l: ['Litre', 1], m3: ['Metreküp', 1000],
    cup: ['Bardak (ABD)', 0.2365882], pt: ['Pint (ABD)', 0.4731765], gal: ['Galon (ABD)', 3.7854118]
  },
  'Hız': {
    ms: ['Metre/sn', 1], kmh: ['Km/saat', 0.2777778], mph: ['Mil/saat', 0.44704],
    kn: ['Knot', 0.5144444], c: ['Işık hızı', 299792458]
  },
  'Veri': {
    b: ['Bit', 1], B: ['Bayt', 8], KB: ['Kilobayt', 8 * 1024],
    MB: ['Megabayt', 8 * 1024 ** 2], GB: ['Gigabayt', 8 * 1024 ** 3],
    TB: ['Terabayt', 8 * 1024 ** 4]
  }
};

let cat = 'Uzunluk';

const tabsEl = document.getElementById('tabs');
const fromVal = document.getElementById('fromVal');
const fromUnit = document.getElementById('fromUnit');
const toUnit = document.getElementById('toUnit');
const out = document.getElementById('out');
const outExact = document.getElementById('outExact');
const unitsBox = document.getElementById('unitsBox');

function toKelvin(v, unit) {
  const spec = CATS['Sıcaklık'][unit][1];
  if (spec === 'c2k') return v + 273.15;
  if (spec === 'f2k') return (v - 32) * 5 / 9 + 273.15;
  if (spec === 'r2k') return v * 5 / 9;
  return v;
}
function fromKelvin(k, unit) {
  const spec = CATS['Sıcaklık'][unit][1];
  if (spec === 'c2k') return k - 273.15;
  if (spec === 'f2k') return (k - 273.15) * 9 / 5 + 32;
  if (spec === 'r2k') return k * 9 / 5;
  return k;
}

function buildTabs() {
  tabsEl.innerHTML = '';
  Object.keys(CATS).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c;
    b.className = c === cat ? 'active' : '';
    b.onclick = () => { cat = c; buildTabs(); buildUnits(); };
    tabsEl.appendChild(b);
  });
}

function buildUnits() {
  const units = Object.keys(CATS[cat]);
  fromUnit.innerHTML = '';
  toUnit.innerHTML = '';
  units.forEach(u => {
    fromUnit.add(new Option(`${CATS[cat][u][0]} (${u})`, u));
    toUnit.add(new Option(`${CATS[cat][u][0]} (${u})`, u));
  });
  if (units.length > 1) toUnit.selectedIndex = 1;
  convert();
}

function convert() {
  const v = parseFloat(fromVal.value);
  const f = fromUnit.value, t = toUnit.value;
  unitsBox.innerHTML = '';

  if (isNaN(v)) { out.textContent = '—'; outExact.textContent = ''; return; }

  let base;
  if (cat === 'Sıcaklık') base = toKelvin(v, f);
  else base = v * CATS[cat][f][1];

  let res;
  if (cat === 'Sıcaklık') res = fromKelvin(base, t);
  else res = base / CATS[cat][t][1];

  out.textContent = `${Number(res.toFixed(6)).toLocaleString('tr-TR', { maximumFractionDigits: 6 })}`;
  outExact.textContent = `${v.toLocaleString('tr-TR')} ${f} → ${t}`;
  document.title = `${Number(res.toFixed(4))} ${t} — Birim Çevirici`;

  // tüm birimlere mini tablo
  Object.keys(CATS[cat]).forEach(u => {
    let val;
    if (cat === 'Sıcaklık') val = fromKelvin(base, u);
    else val = base / CATS[cat][u][1];
    const d = document.createElement('div');
    d.innerHTML = `<b>${val.toLocaleString('tr-TR', { maximumFractionDigits: 3 })}</b>${u}`;
    unitsBox.appendChild(d);
  });
}

document.getElementById('swap').onclick = () => {
  const tmp = fromUnit.value;
  fromUnit.value = toUnit.value;
  toUnit.value = tmp;
  convert();
};

fromVal.addEventListener('input', convert);
fromUnit.addEventListener('change', convert);
toUnit.addEventListener('change', convert);

buildTabs();
buildUnits();
</script>
</body>
</html>
